id = "dudetru25.repository-migration"
name = "Repository Migration"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Re-point path-keyed state after a repository moves"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "migrate-skills-v4"
title = "Migrate Skills V4 state"
contexts = ["workspace"]
command = ["node", "./src/migrate.mjs", "--skills-v4-only"]

[[actions]]
id = "migrate-repository-paths"
title = "Migrate repository path consumers"
contexts = ["workspace"]
command = ["node", "./src/migrate.mjs", "--all-consumers"]
